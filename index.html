<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Profile Ca Nhan</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-hover: #1f242d;
            --accent-color: #5865F2; /* Discord Brand Color */
            --accent-hover: #4752C4;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Avatar Container */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background-color: #23a55a; /* Online Status Color */
            border: 3px solid var(--card-bg);
            border-radius: 50%;
        }

        /* Profile Details */
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .tagline {
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .bio {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Featured Discord Button */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
            margin-bottom: 24px;
        }

        .discord-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
        }

        .discord-btn i {
            font-size: 1.2rem;
        }

        /* Social Links List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background-color: var(--card-hover);
            border-color: var(--text-sub);
            transform: translateX(4px);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .link-info i {
            font-size: 1.1rem;
            width: 20px;
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        /* Footer */
        footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Avatar -->
        <div class="avatar-container">
            <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
            <div class="status-badge" title="Trạng thái: Online"></div>
        </div>

        <!-- Thông tin cá nhân -->
        <h1>Tên Của Bạn</h1>
        <div class="tagline">Developer & Gamer</div>
        <p class="bio">
            Chào mừng bạn ghé thăm profile của mình! Hãy tham gia cộng đồng Discord bên dưới để cùng trò chuyện và giao lưu nhé.
        </p>

        <!-- Nút Discord nổi bật -->
        <a href="https://discord.gg/cX2cT5KQH" target="_blank" class="discord-btn">
            <i class="fa-brands fa-discord"></i>
            Tham Gia Discord Community
        </a>

        <!-- Các liên kết khác -->
        <div class="links-container">
            <a href="https://facebook.com" target="_blank" class="link-item">
                <div class="link-info">
                    <i class="fa-brands fa-facebook" style="color: #1877F2;"></i>
                    <span>Facebook</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://youtube.com" target="_blank" class="link-item">
                <div class="link-info">
                    <i class="fa-brands fa-youtube" style="color: #FF0000;"></i>
                    <span>Kênh YouTube</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://github.com" target="_blank" class="link-item">
                <div class="link-info">
                    <i class="fa-brands fa-github" style="color: #ffffff;"></i>
                    <span>GitHub Profile</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <!-- Footer -->
        <footer>
            © 2026 Powered by You
        </footer>
    </div>

</body>
</html>
